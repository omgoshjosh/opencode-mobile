name: Daily upstream sync

on:
  schedule:
    - cron: "0 11 * * *" # 4 AM Los Angeles (UTC-7/PDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/dzianisv/opencode-mobile.git 2>/dev/null || true
          git fetch upstream --prune

      - name: Check if main is behind upstream
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..HEAD)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "main is $BEHIND behind, $AHEAD ahead of upstream"

      - name: Fast-forward main
        if: steps.check.outputs.behind != '0' && steps.check.outputs.ahead == '0'
        run: |
          git merge --ff-only upstream/main
          git push origin main

      - name: Create sync PR for main (conflicts)
        if: steps.check.outputs.behind != '0' && steps.check.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/upstream-main-$(date +%Y%m%d)"
          git checkout -b "$BRANCH" upstream/main
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: sync main with upstream ($(date +%Y-%m-%d))" \
            --body "Upstream has diverged from our main. This PR brings in upstream changes but could not be fast-forwarded — review for conflicts.

            **Commits behind:** ${{ steps.check.outputs.behind }}
            **Our unique commits:** ${{ steps.check.outputs.ahead }}" \
            --base main \
            --head "$BRANCH"

  # A pristine mirror of upstream/main, never committed to directly.
  #
  # Our own `main` deliberately carries fork-only commits (the evaluation
  # distribution workflow), so it is permanently "ahead" and can never
  # fast-forward. That makes it a poor base for upstream contributions: branching
  # from it drags fork-only commits into any PR.
  #
  # `main-for-opencodex` is force-updated to match upstream exactly, giving a
  # clean base to branch from — `git worktree add -b fix/x main-for-opencodex`
  # produces a PR containing only the fix. Force-push is correct here precisely
  # because nothing is ever authored on this branch; it is a mirror, not a line
  # of development.
  mirror-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror upstream/main to main-for-opencodex
        run: |
          git remote add upstream https://github.com/dzianisv/opencode-mobile.git 2>/dev/null || true
          git fetch upstream --prune
          BEFORE=$(git rev-parse --verify --quiet origin/main-for-opencodex || echo "none")
          AFTER=$(git rev-parse upstream/main)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "main-for-opencodex already at $AFTER — nothing to do"
            exit 0
          fi
          echo "mirroring upstream/main $BEFORE -> $AFTER"
          git push --force origin "$AFTER:refs/heads/main-for-opencodex"
